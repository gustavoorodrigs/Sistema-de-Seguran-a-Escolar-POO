<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Segurança Escolar - Acesso</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <header class="login-header">
                <div class="brand-badge">SSE</div>
                <h1>Segurança Escolar</h1>
                <p>Portal Unificado de Acesso e Monitoramento</p>
            </header>

            <div id="alert-box" class="alert d-none" role="alert"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-mail Cadastrado</label>
                    <input type="email" id="email" name="email" required placeholder="seu.email@escola.com" autocomplete="username">
                    <small class="hint">Informe o e-mail ativo na instituição.</small>
                </div>

                <div class="form-group">
                    <label for="password">Senha de Acesso</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                    <small class="hint">Digite sua credencial segura.</small>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary">
                    <span class="btn-text">Entrar no Sistema</span>
                </button>
            </form>

            <section class="demo-box">
                <h2>Contas de Teste Rápidas (Fase 1)</h2>
                <div class="demo-grid">
                    <button type="button" class="demo-chip" onclick="fillCredentials('coordenador@escola.com', 'Senha@123')">Coordenador</button>
                    <button type="button" class="demo-chip" onclick="fillCredentials('supervisor@escola.com', 'Senha@123')">Supervisor</button>
                    <button type="button" class="demo-chip" onclick="fillCredentials('responsavel@escola.com', 'Senha@123')">Responsável</button>
                    <button type="button" class="demo-chip" onclick="fillCredentials('aluno@escola.com', 'Senha@123')">Aluno</button>
                    <button type="button" class="demo-chip chip-inactive" onclick="fillCredentials('inativo@escola.com', 'Senha@123')">Inativo (Bloqueio)</button>
                </div>
            </section>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
